<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cafétéria iCafe - Cyber Modern</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <style>
        button, .btn-like { touch-action: manipulation; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #0f172a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #06b6d4; border-radius: 10px; }
        .edit-mode { outline: 2px solid #06b6d4; outline-offset: 2px; border-radius: 1rem; }
        .editable { position: relative; cursor: pointer; }
        .editable::after { 
            content: "✎"; 
            position: absolute; 
            top: 2px; 
            right: 4px; 
            font-size: 10px; 
            background: rgba(6, 182, 212, 0.2);
            backdrop-filter: blur(4px);
            color: #06b6d4; 
            border-radius: 10px; 
            padding: 0 4px; 
            pointer-events: none; 
            z-index: 20; 
            border: 1px solid rgba(6, 182, 212, 0.3);
        }
        .cat-btn, .prod-btn {
            transition: all 0.3s ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .cat-btn { padding: 8px 4px; }
        .prod-btn { padding: 8px 4px; aspect-ratio: 1 / 1; }
        .cat-btn img, .prod-btn img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            margin-bottom: 6px;
        }
        .cat-btn:hover, .prod-btn:hover {
            border-color: #06b6d4;
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.2);
        }
        input, textarea { font-size: 16px; }
    </style>
</head>
<body class="bg-gray-950 text-white antialiased overflow-hidden">
    <div id="root"></div>
    <script>
        (function() {
            const { useState, useEffect, useCallback, useMemo, useRef } = React;

            // Données statiques
            const BASE_MENU = {
                coffee: { label: 'Café', color: '#ea580c', items: [{n: 'Espresso', p: 150}, {n: 'قهوة', p: 200}, {n: 'Cappuccino', p: 350}, {n: 'Latte', p: 380}] },
                tea: { label: 'Thé', color: '#7c3aed', items: [{n: 'Earl Grey', p: 250}, {n: 'Vert Sencha', p: 250}, {n: 'Menthe', p: 220}, {n: 'Chai', p: 300}] },
                snack: { label: 'Snack', color: '#eab308', items: [{n: 'Croissant', p: 180}, {n: 'Pain Choco', p: 180}, {n: 'Cookie', p: 200}, {n: 'Muffin', p: 250}] },
                cold: { label: 'Frais', color: '#16a34a', items: [{n: 'Jus Orange', p: 350}, {n: 'Eau Miné', p: 150}, {n: 'Ice Tea', p: 300}, {n: 'Soda', p: 250}] },
                bakery: { label: 'Pain', color: '#db2777', items: [{n: 'Baguette', p: 120}, {n: 'Tradition', p: 140}, {n: 'Pain complet', p: 200}] }
            };

            const generateUUID = () => crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random();
            const getTodayString = () => new Date().toDateString();
            
            const extractFlaticonImageUrl = (url) => {
                const match = url.match(/(\d{6,7})/);
                if (!match) return null;
                const id = match[1];
                return `https://cdn-icons-png.flaticon.com/512/${Math.floor(id / 1000)}/${id}.png`;
            };

            // Composant principal
            const CafeteriaApp = () => {
                // États principaux
                const [transactions, setTransactions] = useState([]);
                const [cart, setCart] = useState([]);
                const [recipes, setRecipes] = useState([]);
                const [activeCategory, setActiveCategory] = useState('coffee');
                const [isEditingMode, setIsEditingMode] = useState(false);
                const [isTablet, setIsTablet] = useState(window.innerWidth >= 768);
                const [activeTab, setActiveTab] = useState('sell');
                const [customMenu, setCustomMenu] = useState(() => {
                    const saved = localStorage.getItem("cafeteria_custom_menu");
                    return saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(BASE_MENU));
                });
                
                // État pour les sons
                const [soundEnabled, setSoundEnabled] = useState(() => {
                    const saved = localStorage.getItem("cafeteria_sound_enabled");
                    return saved !== null ? saved === 'true' : true;
                });
                
                // Modale de détail d'une recette (indépendante)
                const [selectedRecipeDetail, setSelectedRecipeDetail] = useState(null);
                
                // Audio
                const audioCtx = useRef(null);
                const cashSoundRef = useRef(null);
                
                // Sauvegarde de l'état des sons
                useEffect(() => {
                    localStorage.setItem("cafeteria_sound_enabled", soundEnabled);
                }, [soundEnabled]);
                
                useEffect(() => {
                    audioCtx.current = new (window.AudioContext || window.webkitAudioContext)();
                    cashSoundRef.current = new Audio("https://orangefreesounds.com/wp-content/uploads/2026/01/Cash-register-cha-ching-sound-effect.mp3");
                    cashSoundRef.current.preload = "auto";
                    return () => {
                        if (audioCtx.current) audioCtx.current.close();
                        if (cashSoundRef.current) cashSoundRef.current.pause();
                    };
                }, []);
                
                const playClickSound = () => {
                    if (!soundEnabled) return;
                    if (!audioCtx.current) return;
                    const osc = audioCtx.current.createOscillator();
                    const gain = audioCtx.current.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.current.destination);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, audioCtx.current.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(400, audioCtx.current.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, audioCtx.current.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.current.currentTime + 0.1);
                    osc.start();
                    osc.stop(audioCtx.current.currentTime + 0.1);
                };
                
                const playCashSound = () => {
                    if (!soundEnabled) return;
                    if (cashSoundRef.current) {
                        cashSoundRef.current.currentTime = 0;
                        cashSoundRef.current.play().catch(e => console.log("Audio bloqué", e));
                    }
                };
                
                // Modales
                const [isModalOpen, setIsModalOpen] = useState(false);
                const [showHistory, setShowHistory] = useState(false);
                const [showSyncPanel, setShowSyncPanel] = useState(false);
                const [showImagePanel, setShowImagePanel] = useState(false);
                const [imgbbApiKey, setImgbbApiKey] = useState('');
                const [imgbbApiKeySaved, setImgbbApiKeySaved] = useState('');
                const [uploadedImageUrl, setUploadedImageUrl] = useState('');
                const [isUploading, setIsUploading] = useState(false);
                const [uploadMessage, setUploadMessage] = useState('');
                const fileInputRef = useRef(null);
                const [importJsonText, setImportJsonText] = useState("");
                const [exportJsonText, setExportJsonText] = useState("");
                const [qrCodeUrl, setQrCodeUrl] = useState("");
                const [editModal, setEditModal] = useState({ open: false, type: null, categoryKey: null, itemIndex: null });
                const [tempEditName, setTempEditName] = useState('');
                const [tempEditPrice, setTempEditPrice] = useState('');
                const [tempEditImageUrl, setTempEditImageUrl] = useState('');
                const [tempEditUrlImport, setTempEditUrlImport] = useState('');
                const [editUploading, setEditUploading] = useState(false);
                const [urlImportLoading, setUrlImportLoading] = useState(false);
                const pressTimer = useRef(null);
                const optionsPressTimer = useRef(null);
                
                // Sauvegarde menu
                useEffect(() => { localStorage.setItem("cafeteria_custom_menu", JSON.stringify(customMenu)); }, [customMenu]);
                
                // Chargement localStorage
                useEffect(() => {
                    const savedTx = localStorage.getItem("cafeteria_transactions");
                    if (savedTx) try { setTransactions(JSON.parse(savedTx)); } catch(e) {}
                    const savedRec = localStorage.getItem("cafeteria_recipes");
                    if (savedRec) try { setRecipes(JSON.parse(savedRec)); } catch(e) {}
                    const savedKey = localStorage.getItem("imgbb_api_key");
                    if (savedKey) { setImgbbApiKeySaved(savedKey); setImgbbApiKey(savedKey); }
                }, []);
                
                useEffect(() => { localStorage.setItem("cafeteria_transactions", JSON.stringify(transactions)); }, [transactions]);
                useEffect(() => { localStorage.setItem("cafeteria_recipes", JSON.stringify(recipes)); }, [recipes]);
                useEffect(() => { localStorage.setItem("imgbb_api_key", imgbbApiKeySaved); }, [imgbbApiKeySaved]);
                
                useEffect(() => {
                    const handleResize = () => setIsTablet(window.innerWidth >= 768);
                    window.addEventListener("resize", handleResize);
                    return () => window.removeEventListener("resize", handleResize);
                }, []);
                
                // Upload images (inchangé)
                const resizeImage = (file) => new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let w = img.width, h = img.height;
                            const maxSize = 120;
                            if (w > h) { if (w > maxSize) { h = (h * maxSize) / w; w = maxSize; } }
                            else { if (h > maxSize) { w = (w * maxSize) / h; h = maxSize; } }
                            canvas.width = w; canvas.height = h;
                            const ctx = canvas.getContext('2d');
                            ctx.clearRect(0, 0, w, h);
                            ctx.drawImage(img, 0, 0, w, h);
                            resolve(canvas.toDataURL('image/png', 0.92));
                        };
                        img.onerror = reject;
                        img.src = e.target.result;
                    };
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
                
                const uploadToImgBB = async (base64) => {
                    if (!imgbbApiKeySaved) throw new Error("Clé API manquante");
                    const fd = new FormData();
                    fd.append("key", imgbbApiKeySaved);
                    fd.append("image", base64.split(',')[1]);
                    const res = await fetch("https://api.imgbb.com/1/upload", { method: "POST", body: fd });
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const data = await res.json();
                    if (data.success) return data.data.url;
                    throw new Error(data.error?.message || "Erreur ImgBB");
                };
                
                const uploadFile = async (file) => {
                    if (!imgbbApiKeySaved) { setUploadMessage("❌ Clé API manquante"); return null; }
                    setIsUploading(true);
                    try {
                        const resized = await resizeImage(file);
                        const url = await uploadToImgBB(resized);
                        setUploadMessage("✅ Upload réussi !");
                        return url;
                    } catch(err) { setUploadMessage("❌ Erreur: "+err.message); return null; }
                    finally { setIsUploading(false); }
                };
                
                const importFromUrl = async (url) => {
                    if (!url.trim()) return null;
                    if (!imgbbApiKeySaved) { setUploadMessage("❌ Clé API manquante"); return null; }
                    let imageUrl = url;
                    if (url.includes('flaticon.com')) {
                        const cdnUrl = extractFlaticonImageUrl(url);
                        if (cdnUrl) imageUrl = cdnUrl;
                        else { setUploadMessage("❌ Lien Flaticon invalide"); return null; }
                    }
                    setIsUploading(true);
                    try {
                        const response = await fetch(imageUrl, { mode: 'cors' });
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        const blob = await response.blob();
                        const file = new File([blob], "image_from_url", { type: blob.type || 'image/png' });
                        const resized = await resizeImage(file);
                        const uploadedUrl = await uploadToImgBB(resized);
                        setUploadMessage("✅ Import réussi !");
                        return uploadedUrl;
                    } catch(err) { setUploadMessage("❌ Erreur: "+err.message); return null; }
                    finally { setIsUploading(false); }
                };
                
                // Métier
                const handleAddToCart = (item) => { playClickSound(); setCart(prev => [...prev, item]); };
                const handleUndoLastRecipe = () => {
                    if (!recipes.length) return;
                    playClickSound();
                    const last = recipes[recipes.length-1];
                    setRecipes(prev => prev.slice(0,-1));
                    setCart(prev => [...prev, ...last.items]);
                    setTransactions(prev => prev.filter(t => t.timestamp !== last.timestamp));
                };
                const handleClearCart = () => { if (cart.length) { playClickSound(); setCart([]); } };
                const handleCash = () => {
                    if (!cart.length) return;
                    playCashSound();
                    const recipe = { uuid: generateUUID(), timestamp: Date.now(), items: [...cart], total: cart.reduce((s,i)=>s+i.p,0) };
                    setRecipes(prev => [...prev, recipe]);
                    const newTx = cart.map(item => ({ uuid: generateUUID(), timestamp: recipe.timestamp, item }));
                    setTransactions(prev => [...prev, ...newTx]);
                    setCart([]);
                };
                const cartTotal = useMemo(() => cart.reduce((s,i)=>s+i.p,0), [cart]);
                const hasRecipes = recipes.length > 0;
                
                const exportData = useCallback(() => {
                    const str = JSON.stringify(transactions);
                    if (isTablet) { setExportJsonText(str); setQrCodeUrl(""); }
                    else { setQrCodeUrl(`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(str)}`); setExportJsonText(""); }
                }, [transactions, isTablet]);
                
                const importAndMerge = useCallback(() => {
                    if (!importJsonText.trim()) return;
                    try {
                        const imported = JSON.parse(importJsonText);
                        if (!Array.isArray(imported)) throw new Error("Format invalide");
                        const map = new Map(transactions.map(t=>[t.uuid,t]));
                        imported.forEach(t=>{ if(t.uuid && !map.has(t.uuid)) map.set(t.uuid,t); });
                        const merged = Array.from(map.values()).sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));
                        setTransactions(merged);
                        setImportJsonText("");
                        playClickSound();
                        alert(`Fusion : ${merged.length} transactions`);
                    } catch(e) { alert("Erreur: "+e.message); }
                }, [transactions, importJsonText]);
                
                const getTodayRecipes = () => {
                    const today = getTodayString();
                    return recipes.filter(r => new Date(r.timestamp).toDateString() === today);
                };
                
                // Gestion édition (inchangée)
                const openEditModal = (type, catKey, idx=null) => {
                    if (type === 'category') {
                        const cat = customMenu[catKey];
                        setTempEditName(cat.label);
                        setTempEditImageUrl(cat.imageUrl || '');
                        setTempEditPrice(0);
                    } else {
                        const item = customMenu[catKey].items[idx];
                        setTempEditName(item.n);
                        setTempEditPrice(item.p);
                        setTempEditImageUrl(item.imageUrl || '');
                    }
                    setEditModal({ open: true, type, categoryKey: catKey, itemIndex: idx });
                    setTempEditUrlImport('');
                };
                
                const closeEditModal = () => {
                    setEditModal({ open: false, type: null, categoryKey: null, itemIndex: null });
                    setTempEditName('');
                    setTempEditPrice(0);
                    setTempEditImageUrl('');
                    setTempEditUrlImport('');
                    setEditUploading(false);
                    setUrlImportLoading(false);
                };
                
                const saveEdit = () => {
                    setCustomMenu(prev => {
                        const newMenu = JSON.parse(JSON.stringify(prev));
                        if (editModal.type === 'category') {
                            newMenu[editModal.categoryKey].label = tempEditName;
                            if (tempEditImageUrl) newMenu[editModal.categoryKey].imageUrl = tempEditImageUrl;
                            else delete newMenu[editModal.categoryKey].imageUrl;
                        } else {
                            const item = newMenu[editModal.categoryKey].items[editModal.itemIndex];
                            item.n = tempEditName;
                            item.p = tempEditPrice;
                            if (tempEditImageUrl) item.imageUrl = tempEditImageUrl;
                            else delete item.imageUrl;
                        }
                        return newMenu;
                    });
                    closeEditModal();
                };
                
                const handleImportUrl = async () => {
                    if (!tempEditUrlImport) return;
                    setUrlImportLoading(true);
                    const url = await importFromUrl(tempEditUrlImport);
                    if (url) setTempEditImageUrl(url);
                    setUrlImportLoading(false);
                };
                
                const handleEditFileUpload = async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    setEditUploading(true);
                    const url = await uploadFile(file);
                    if (url) setTempEditImageUrl(url);
                    setEditUploading(false);
                    e.target.value = '';
                };
                
                const handleGeneralFileUpload = async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const url = await uploadFile(file);
                    if (url) setUploadedImageUrl(url);
                };
                
                const saveApiKey = () => {
                    if (imgbbApiKey.trim()) { setImgbbApiKeySaved(imgbbApiKey.trim()); setUploadMessage("Clé sauvegardée"); }
                    else { setUploadMessage("Clé vide"); setImgbbApiKeySaved(''); }
                };
                
                // Long press
                const handlePressStart = (type, catKey, idx=null) => (e) => {
                    if (!isEditingMode) return;
                    e.preventDefault();
                    pressTimer.current = setTimeout(() => openEditModal(type, catKey, idx), 500);
                };
                const handlePressEnd = () => { if (pressTimer.current) clearTimeout(pressTimer.current); };
                
                const handleOptionsClick = (e) => { e.preventDefault(); e.stopPropagation(); setIsModalOpen(true); };
                const handleOptionsLongPress = () => { setIsEditingMode(!isEditingMode); };
                
                // ========== NOUVELLES VUES ==========
                
                // Vue "Recette du jour" (avec heure formatée hh:mm)
                const RecipesView = () => {
                    const todayRecipes = getTodayRecipes();
                    const totalToday = todayRecipes.reduce((sum, r) => sum + r.total, 0);
                    return React.createElement('div', { className: "flex-1 flex flex-col p-2 overflow-hidden" },
                        React.createElement('div', { className: "bg-gray-900/40 backdrop-blur-sm rounded-lg border border-cyan-900/30 flex flex-col h-full overflow-hidden p-2" },
                            React.createElement('h2', { className: "text-cyan-400 font-bold text-sm mb-2 flex items-center gap-1" }, React.createElement('span', { className: "text-sm" }, "📋"), "Recettes du jour"),
                            React.createElement('div', { className: "flex-1 overflow-y-auto" },
                                todayRecipes.length === 0 ? 
                                    React.createElement('p', { className: "text-gray-400 text-xs text-center py-4" }, "Aucune commande validée aujourd'hui") :
                                    React.createElement('div', { className: "space-y-2" },
                                        todayRecipes.map(recipe => {
                                            const date = new Date(recipe.timestamp);
                                            const hours = date.getHours().toString().padStart(2, '0');
                                            const minutes = date.getMinutes().toString().padStart(2, '0');
                                            const timeStr = `${hours}:${minutes}`;
                                            return React.createElement('button', { 
                                                key: recipe.uuid, 
                                                onClick: () => setSelectedRecipeDetail(recipe), 
                                                className: "w-full text-left bg-gray-800/40 rounded-lg border border-cyan-900/30 p-2 hover:border-cyan-500/50 transition-all" 
                                            },
                                                React.createElement('div', { className: "flex justify-between" },
                                                    React.createElement('span', { className: "text-xs" }, "📅 ", timeStr),
                                                    React.createElement('span', { className: "font-bold text-cyan-300" }, recipe.total, " DZD")
                                                ),
                                                React.createElement('span', { className: "text-[10px] text-gray-400" }, recipe.items.length, " article(s)")
                                            );
                                        })
                                    )
                            ),
                            React.createElement('div', { className: "border-t border-cyan-900/30 mt-2 pt-2 flex justify-between font-bold text-sm" },
                                React.createElement('span', {}, "💰 TOTAL DU JOUR"),
                                React.createElement('span', { className: "text-cyan-400" }, totalToday, " DZD")
                            )
                        )
                    );
                };
                
                // Vue "Historique des transactions" (ancien journal) pour la modale Options
                const HistoryView = () => {
                    const totalAll = transactions.reduce((s, t) => s + t.item.p, 0);
                    return React.createElement('div', { className: "mt-2 border-t border-cyan-900/30 pt-2" },
                        React.createElement('h3', { className: "font-bold text-sm mb-2 flex items-center gap-1" }, React.createElement('span', { className: "text-sm" }, "📜"), "Historique complet"),
                        React.createElement('div', { className: "max-h-60 overflow-y-auto space-y-1" },
                            transactions.length === 0 ? 
                                React.createElement('p', { className: "text-gray-400 text-xs" }, "Aucune transaction") :
                                transactions.slice().reverse().map(t => 
                                    React.createElement('div', { key: t.uuid, className: "flex justify-between border-b border-cyan-900/20 py-1 text-xs" },
                                        React.createElement('span', {}, t.item.n),
                                        React.createElement('span', { className: "font-mono text-cyan-300" }, t.item.p, " DZD"),
                                        React.createElement('span', { className: "text-[9px] text-gray-400" }, new Date(t.timestamp).toLocaleTimeString())
                                    )
                                )
                        ),
                        React.createElement('div', { className: "border-t border-cyan-900/30 mt-2 pt-2 flex justify-between font-bold text-xs" },
                            React.createElement('span', {}, "💰 TOTAL GÉNÉRAL"),
                            React.createElement('span', { className: "text-cyan-400" }, totalAll, " DZD")
                        )
                    );
                };
                
                // Composants de rendu (CategoryButton, ProductButton inchangés)
                const CategoryButton = ({ menuKey, cat, isActive }) => {
                    const baseColor = BASE_MENU[menuKey].color;
                    const imageUrl = cat.imageUrl;
                    const activeClass = isActive 
                        ? "border-cyan-500 shadow-[0_0_8px_rgba(6,182,212,0.3)] bg-gray-800/80" 
                        : "border-cyan-900/30 bg-gray-900/60 hover:border-cyan-500/50 hover:shadow-[0_0_6px_rgba(6,182,212,0.15)]";
                    let className = `cat-btn rounded-lg font-bold text-xs transition-all duration-300 ${activeClass} backdrop-blur-sm`;
                    if (!imageUrl) {
                        className += isActive ? " text-white" : " text-gray-300";
                    } else {
                        className += " text-white";
                    }
                    if (isEditingMode) className += " editable";
                    
                    return React.createElement('button', {
                        onClick: () => setActiveCategory(menuKey),
                        onTouchStart: handlePressStart('category', menuKey),
                        onTouchEnd: handlePressEnd,
                        onMouseDown: handlePressStart('category', menuKey),
                        onMouseUp: handlePressEnd,
                        className: className,
                        style: !imageUrl && isActive ? { backgroundColor: baseColor } : (!imageUrl ? { backgroundColor: '#1f2937' } : {})
                    },
                        imageUrl ? React.createElement('img', { src: imageUrl, alt: cat.label }) : null,
                        !imageUrl && isActive ? React.createElement('div', { className: "w-6 h-0.5 rounded-full mb-1", style: { backgroundColor: baseColor } }) : null,
                        React.createElement('span', {}, cat.label)
                    );
                };
                
                const ProductButton = ({ item, idx, catKey }) => {
                    const imageUrl = item.imageUrl;
                    let className = `prod-btn rounded-lg transition-all duration-300 text-center border border-cyan-900/30 bg-gray-900/60 hover:border-cyan-500/50 hover:shadow-[0_0_6px_rgba(6,182,212,0.15)] active:scale-95 backdrop-blur-sm`;
                    if (!imageUrl) className += " text-gray-200";
                    else className += " text-white";
                    if (isEditingMode) className += " editable";
                    
                    return React.createElement('button', {
                        key: idx,
                        onClick: () => handleAddToCart(item),
                        onTouchStart: handlePressStart('product', catKey, idx),
                        onTouchEnd: handlePressEnd,
                        onMouseDown: handlePressStart('product', catKey, idx),
                        onMouseUp: handlePressEnd,
                        className: className
                    },
                        imageUrl ? React.createElement('img', { src: imageUrl, alt: item.n }) : null,
                        React.createElement('div', { className: "text-container" },
                            React.createElement('span', { className: "font-bold text-[10px]" }, item.n),
                            React.createElement('span', { className: "text-[8px] text-cyan-400 block" }, item.p, " DZD")
                        )
                    );
                };
                
                // Vue Vendre (avec bouton retour repositionné)
